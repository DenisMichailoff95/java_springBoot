# Server Configuration
server.port=8080

# PostgreSQL Database Configuration for prod profile
spring.datasource.url=jdbc:postgresql://localhost:5433/task_manager_alpine
spring.datasource.username=alpine_user
spring.datasource.password=alpine_user_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Application Properties
app.service.greeting.message=Hello from Prod PostgreSQL