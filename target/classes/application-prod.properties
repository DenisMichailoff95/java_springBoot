# Server Configuration
server.port=8080

# PostgreSQL Database Configuration for prod profile
spring.datasource.url=jdbc:postgresql://localhost:5433/task_manager_alpine
spring.datasource.username=alpine_user
spring.datasource.password=alpine_user_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=test_schema


# Application Properties
app.service.greeting.message=Hello from Prod PostgreSQL


# Logging Configuration - ?????? ???????????
logging.level.root=INFO
logging.level.com.dma.springboot=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# File Logging (???????????)
logging.file.name=logs/application-prod.log
logging.file.max-size=10MB
logging.file.max-history=10